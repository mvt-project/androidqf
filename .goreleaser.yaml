# GoReleaser configuration for androidqf
version: 2

before:
    hooks:
        # Build the Android collector for each target architecture
        - sh -c 'cd android-collector && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -ldflags="-s -w" -o ../assets/collector_arm . && upx --best ../assets/collector_arm'
        - sh -c 'cd android-collector && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../assets/collector_arm64 . && upx --best ../assets/collector_arm64'
        # Download platform tools for different OSes
        # Windows platform tools
        - ./scripts/download_platform_tools.sh windows
        - bash -c 'cd /tmp && unzip -o /tmp/platform-tools-downloads/platform-tools-latest-windows.zip'
        - cp /tmp/platform-tools/AdbWinApi.dll assets/
        - cp /tmp/platform-tools/AdbWinUsbApi.dll assets/
        - cp /tmp/platform-tools/adb.exe assets/
        # macOS platform tools
        - ./scripts/download_platform_tools.sh darwin
        - bash -c 'cd /tmp && unzip -o /tmp/platform-tools-downloads/platform-tools-latest-darwin.zip'
        - cp /tmp/platform-tools/adb assets/adb_darwin
        # Linux platform tools
        - ./scripts/download_platform_tools.sh linux
        - bash -c 'cd /tmp && unzip -o /tmp/platform-tools-downloads/platform-tools-latest-linux.zip'
        - cp /tmp/platform-tools/adb assets/adb_linux
        # Windows version resource. SignPath signs only an executable whose
        # product name and version match its artifact configuration, which
        # takes the version as numbers only.
        - go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest none --out rsrc --product-name androidqf --file-description androidqf --copyright "Copyright Amnesty International Security Lab" --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }} --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
    - id: windows-amd64
      main: .
      binary: androidqf
      goos:
          - windows
      goarch:
          - amd64
      env:
          - CGO_ENABLED=1
          - CC=x86_64-w64-mingw32-gcc
      ldflags:
          - -s -w
          - -X github.com/mvt-project/androidqf/utils.Version={{.Version}}
          - -extldflags "-static"

    - id: linux-amd64
      main: .
      binary: androidqf
      goos:
          - linux
      goarch:
          - amd64
      env:
          - CGO_ENABLED=0
      ldflags:
          - -s -w
          - -X github.com/mvt-project/androidqf/utils.Version={{.Version}}

    - id: linux-arm64
      main: .
      binary: androidqf
      goos:
          - linux
      goarch:
          - arm64
      env:
          - CGO_ENABLED=0
      ldflags:
          - -s -w
          - -X github.com/mvt-project/androidqf/utils.Version={{.Version}}

    - id: darwin-amd64
      main: .
      binary: androidqf
      goos:
          - darwin
      goarch:
          - amd64
      env:
          - CGO_ENABLED=0
      ldflags:
          - -s -w
          - -X github.com/mvt-project/androidqf/utils.Version={{.Version}}

    - id: darwin-arm64
      main: .
      binary: androidqf
      goos:
          - darwin
      goarch:
          - arm64
      env:
          - CGO_ENABLED=0
      ldflags:
          - -s -w
          - -X github.com/mvt-project/androidqf/utils.Version={{.Version}}

# Universal binaries for macOS
# Note: This works on Linux runners (ubuntu-latest)! GoReleaser uses a Go-based
# implementation of lipo, so you don't need a macOS runner to create universal binaries.
universal_binaries:
    - id: darwin-universal
      ids:
          - darwin-amd64
          - darwin-arm64
      replace: true
      name_template: androidqf

upx:
  - # Compress binaries to make them smaller
    enabled: true
    compress: best
    # Not Windows: the executable is code-signed and keeps its version resource
    # readable. Mac universal binaries are broken with UPX.
    goos: [linux]


# Archives disabled - we only want raw binaries
archives:
    - id: default
      formats: binary
      name_template: >-
          {{- .ProjectName }}_
          {{- if eq .Os "darwin" }}macos
          {{- else }}{{ .Os }}{{ end }}_
          {{- if eq .Arch "all" }}universal
          {{- else }}{{ .Arch }}{{ end }}_
          {{- .Version }}

checksum:
    name_template: "checksums.txt"

snapshot:
    version_template: "{{ incpatch .Version }}-next"

changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - "^ci:"
            - "^build:"
            - Merge pull request
            - Merge branch
